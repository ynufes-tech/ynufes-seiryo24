name: Deploy to Cloud Run (Release)
on:
  release:
    types:
      - released
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: "projects/292061085119/locations/global/workloadIdentityPools/github-pool/providers/provider-github"
          service_account: "gh-actions@ynufes-hp-cloudrun.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"
        with:
          version: ">= 363.0.0"

      - name: Authorize Docker
        id: docker-auth
        uses: docker/login-action@v3
        with:
          username: "oauth2accesstoken"
          password: ${{ steps.auth.outputs.access_token }}
          registry: asia-northeast1-docker.pkg.dev

      # Archive event data is versioned with the source to keep rebuilds reproducible.

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: asia-northeast1-docker.pkg.dev/ynufes-hp-cloudrun/release/seiryo24:latest
          context: .
          file: ./cloudrun/Dockerfile

      - name: Reject vulnerable runtime images
        env:
          TRIVY_USERNAME: oauth2accesstoken
          TRIVY_PASSWORD: ${{ steps.auth.outputs.access_token }}
          IMAGE_REF: asia-northeast1-docker.pkg.dev/ynufes-hp-cloudrun/release/seiryo24@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.71.1@sha256:53570e6911c2361ebe7995228088cf83a6b9b73e7f3cdca44bd8f8f425e80fa7 \
            image --image-src remote --scanners vuln --exit-code 1 --severity MEDIUM,HIGH,CRITICAL "$IMAGE_REF"

      - name: Deploy verified image
        env:
          IMAGE_REF: asia-northeast1-docker.pkg.dev/ynufes-hp-cloudrun/release/seiryo24@${{ steps.build.outputs.digest }}
        run: |
          gcloud run services update hp-main --project=ynufes-hp-cloudrun --region=asia-northeast1 \
            --container=seiryo24 --image="$IMAGE_REF" --quiet
